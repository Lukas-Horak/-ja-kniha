<!DOCTYPE html>
<html lang="sk">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GF9CWN6F0L"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GF9CWN6F0L');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ďakujeme za objednávku | JA — Evolúcia vedomia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #E8E5DF;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 600px; text-align: center; }
        .checkmark {
            width: 80px; height: 80px; border-radius: 50%;
            background: #1a1a1a;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 2rem;
            animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .checkmark svg {
            width: 36px; height: 36px; stroke: #E8E5DF;
            stroke-width: 2.5; fill: none;
            stroke-dasharray: 50; stroke-dashoffset: 50;
            animation: drawCheck 0.6s ease-out 0.3s forwards;
        }
        @keyframes scaleIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes drawCheck { to { stroke-dashoffset: 0; } }
        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 300; font-style: italic;
            letter-spacing: -0.03em; margin-bottom: 1rem; line-height: 1.2;
        }
        p { font-size: 1.1rem; color: #6B6B6B; line-height: 1.7; margin-bottom: 1.5rem; }
        .order-id {
            font-size: 0.85rem; color: #999;
            background: rgba(0,0,0,0.04);
            padding: 0.75rem 1.5rem; border-radius: 12px;
            display: inline-block; margin-bottom: 2rem;
            font-family: monospace;
        }
        .back-link {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 16px 36px;
            background: #1a1a1a; color: #fff;
            text-decoration: none; border-radius: 100px;
            font-size: 0.95rem; font-weight: 500;
            transition: opacity 0.3s ease;
        }
        .back-link:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">
            <svg viewBox="0 0 24 24"><polyline points="6 12 10 16 18 8"></polyline></svg>
        </div>
        <h1>Ďakujeme za tvoju objednávku.</h1>
        <p>Platba prebehla úspešne. Knihu <strong>JA — Evolúcia vedomia</strong> ti odošleme čo najskôr. Potvrdzujúci email je na ceste do tvojej schránky.</p>
        <div class="order-id" id="sessionId"></div>
        <br><br>
        <a href="/" class="back-link">Späť na hlavnú stránku</a>
    </div>
    <script>
        var params = new URLSearchParams(window.location.search);
        var sessionId = params.get('session_id');
        var el = document.getElementById('sessionId');
        if (sessionId) {
            el.textContent = 'ID objednávky: ' + sessionId.substring(0, 20) + '...';
        } else {
            el.style.display = 'none';
        }
    </script>
</body>
</html>
