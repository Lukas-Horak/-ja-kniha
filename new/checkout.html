<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objednávka | JA – Evolúcia vedomia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' stroke='%231a1a1a' stroke-width='2' fill='none'/%3E%3Cpath d='M16 2C10.5 2 6 6.5 6 12c0 3.7 1.9 7 4.8 8.8' stroke='%231a1a1a' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%231a1a1a'/%3E%3C/svg%3E">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
        --bg: #E8E5DF;
        --card: #FFFFFF;
        --text: #1A1A1A;
        --text-light: #6B6B6B;
        --text-muted: #999999;
        --border: #E0DCD6;
        --dark: #1A1A1A;
        --font: 'Urbanist', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html { font-size: 16px; }
    body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        padding: 48px;
    }
    .container {
        max-width: 1100px;
        margin: 0 auto;
    }
    .back-link {
        display: inline-flex; align-items: center; gap: 8px;
        font-size: 0.9rem; color: var(--text-muted);
        margin-bottom: 32px;
    }
    .back-link:hover { color: var(--text); }
    .back-link svg { width: 16px; height: 16px; }
    h1 {
        font-size: clamp(2rem, 4vw, 2.8rem);
        font-weight: 400;
        font-style: italic;
        letter-spacing: -0.03em;
        margin-bottom: 48px;
    }
    .checkout-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 48px;
        align-items: start;
    }
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 24px;
    }
    .form-row.single { grid-template-columns: 1fr; }
    .form-group { margin-bottom: 0; }
    .form-label {
        display: block;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-bottom: 8px;
    }
    .form-input {
        width: 100%;
        padding: 16px 20px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        font-size: 0.95rem;
        font-family: var(--font);
        color: var(--text);
        background: var(--card);
        transition: border-color 0.2s;
        outline: none;
    }
    .form-input::placeholder { color: var(--text-muted); }
    .form-input:focus { border-color: var(--text); }

    .quantity-section { margin-bottom: 24px; }
    .quantity-controls {
        display: flex; align-items: center; gap: 0;
    }
    .qty-btn {
        width: 48px; height: 48px;
        border-radius: 50%;
        border: 1.5px solid var(--border);
        background: var(--card);
        font-size: 1.2rem;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; color: var(--text);
        font-family: var(--font);
        transition: all 0.2s;
    }
    .qty-btn:hover { border-color: var(--text); }
    .qty-value {
        width: 56px; text-align: center;
        font-size: 1.1rem; font-weight: 500;
    }

    .promo-toggle {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 0.9rem; color: #5B8DEF;
        cursor: pointer; border: none; background: none;
        font-family: var(--font); font-weight: 400;
    }
    .promo-toggle:hover { text-decoration: underline; }
    .promo-field {
        display: none; margin-top: 16px;
    }
    .promo-field.show { display: flex; gap: 12px; }
    .promo-field input {
        flex: 1;
        padding: 14px 20px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        font-size: 0.95rem;
        font-family: var(--font);
        background: var(--card);
        outline: none;
    }
    .promo-field input:focus { border-color: var(--text); }
    .promo-apply {
        padding: 14px 24px;
        background: var(--dark);
        color: #fff;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        font-family: var(--font);
        font-size: 0.9rem;
        font-weight: 500;
    }
    .promo-msg {
        font-size: 0.85rem; margin-top: 8px;
    }
    .promo-msg.success { color: #10B981; }
    .promo-msg.error { color: #E65C50; }

    /* Order summary */
    .summary {
        background: var(--card);
        border-radius: 20px;
        padding: 40px;
        position: sticky; top: 48px;
    }
    .summary h2 {
        font-size: 1.3rem; font-weight: 500;
        margin-bottom: 24px; letter-spacing: -0.01em;
    }
    .summary-product {
        display: flex; gap: 16px; align-items: center;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 20px;
    }
    .summary-thumb {
        width: 64px; height: 64px;
        border-radius: 12px;
        background: #F5F3EF;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.1rem; font-weight: 600; color: var(--text-muted);
    }
    .summary-info { flex: 1; }
    .summary-info .name { font-size: 1rem; font-weight: 500; }
    .summary-info .meta { font-size: 0.85rem; color: var(--text-muted); }
    .summary-price { font-size: 1rem; font-weight: 500; }

    .summary-line {
        display: flex; justify-content: space-between;
        padding: 8px 0;
        font-size: 0.95rem;
    }
    .summary-line .label { color: var(--text-light); }
    .summary-line.discount .value { color: #10B981; }
    .summary-total {
        display: flex; justify-content: space-between;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        margin-top: 12px;
        font-size: 1.1rem; font-weight: 500;
    }
    .summary-total .value {
        font-size: 1.5rem; font-weight: 500;
        letter-spacing: -0.02em;
    }

    .card-label {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin: 24px 0 12px;
    }
    #card-element {
        padding: 16px 20px;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        background: var(--card);
    }
    #card-errors {
        font-size: 0.85rem; color: #E65C50;
        margin-top: 8px; min-height: 20px;
    }

    .pay-btn {
        display: flex; align-items: center; justify-content: center; gap: 10px;
        width: 100%; padding: 18px;
        background: var(--dark); color: #fff;
        border-radius: 100px; border: none;
        font-size: 1rem; font-weight: 500;
        cursor: pointer; font-family: var(--font);
        margin-top: 24px;
        transition: opacity 0.2s;
    }
    .pay-btn:hover { opacity: 0.85; }
    .pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .pay-btn svg { width: 14px; height: 14px; }

    .secure-note {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        font-size: 0.8rem; color: var(--text-muted);
        margin-top: 16px;
    }
    .secure-note svg { width: 14px; height: 14px; }

    @media (max-width: 768px) {
        body { padding: 24px; }
        .checkout-grid {
            grid-template-columns: 1fr;
        }
        .form-row { grid-template-columns: 1fr; }
        .summary { position: static; }
    }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Späť na stránku
    </a>

    <h1>Doručovacie údaje</h1>

    <div class="checkout-grid">
        <div class="form-side">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Meno</label>
                    <input type="text" class="form-input" id="firstName" placeholder="Meno">
                </div>
                <div class="form-group">
                    <label class="form-label">Priezvisko</label>
                    <input type="text" class="form-input" id="lastName" placeholder="Priezvisko">
                </div>
            </div>
            <div class="form-row single">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="email" placeholder="tvoj@email.sk">
                </div>
            </div>
            <div class="form-row single">
                <div class="form-group">
                    <label class="form-label">Telefón</label>
                    <input type="tel" class="form-input" id="phone" placeholder="+421 ...">
                </div>
            </div>
            <div class="form-row single">
                <div class="form-group">
                    <label class="form-label">Ulica a číslo</label>
                    <input type="text" class="form-input" id="address" placeholder="Ulica a číslo domu">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Mesto</label>
                    <input type="text" class="form-input" id="city" placeholder="Mesto">
                </div>
                <div class="form-group">
                    <label class="form-label">PSČ</label>
                    <input type="text" class="form-input" id="zip" placeholder="PSČ">
                </div>
            </div>

            <div class="quantity-section">
                <label class="form-label">Počet kusov</label>
                <div class="quantity-controls">
                    <button class="qty-btn" onclick="changeQty(-1)">−</button>
                    <span class="qty-value" id="qtyValue">1</span>
                    <button class="qty-btn" onclick="changeQty(1)">+</button>
                </div>
            </div>

            <div>
                <button class="promo-toggle" onclick="togglePromo()">+ Mám zľavový kód</button>
                <div class="promo-field" id="promoField">
                    <input type="text" id="promoInput" placeholder="Zadajte kód">
                    <button class="promo-apply" onclick="applyPromo()">Použiť</button>
                </div>
                <div class="promo-msg" id="promoMsg"></div>
            </div>
        </div>

        <div class="summary">
            <h2>Zhrnutie objednávky</h2>
            <div class="summary-product">
                <div class="summary-thumb">JA</div>
                <div class="summary-info">
                    <div class="name">JA – Evolúcia vedomia</div>
                    <div class="meta">Lukáš Horák · <span id="summaryQty">1</span>×</div>
                </div>
                <div class="summary-price" id="summaryItemPrice">33.00 €</div>
            </div>

            <div class="summary-line">
                <span class="label">Medzisúčet</span>
                <span class="value" id="subtotal">33.00 €</span>
            </div>
            <div class="summary-line">
                <span class="label">Poštovné</span>
                <span class="value" id="shipping">3.90 €</span>
            </div>
            <div class="summary-line discount" id="discountLine" style="display:none;">
                <span class="label">Zľava (VEDOMIE10)</span>
                <span class="value" id="discountValue">-3.30 €</span>
            </div>

            <div class="summary-total">
                <span class="label">Celkom</span>
                <span class="value" id="totalPrice">36.90 €</span>
            </div>

            <p class="card-label">Platobná karta</p>
            <div id="card-element"></div>
            <div id="card-errors"></div>

            <button class="pay-btn" id="payBtn" onclick="handlePayment()">
                <span id="payBtnText">Zaplatiť 36.90 €</span>
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 12L12 4M12 4H5M12 4v7"/>
                </svg>
            </button>

            <div class="secure-note">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0110 0v4"/>
                </svg>
                Zabezpečená platba cez Stripe
            </div>
        </div>
    </div>
</div>

<script>
const BOOK_PRICE = 33.00;
const SHIPPING = 3.90;
let quantity = 1;
let discount = 0;
let promoApplied = false;

// Stripe setup
const stripe = Stripe('pk_live_51T81w2B5B1tNqSGiGl0j6Z2JlJXbSmI1KwGkmcH38kMLB7ewuDo1GCLZolk8XXGjoIVaWbKgqDQUO69iWhKlEfn500GsdigJ2X');
const elements = stripe.elements({
    fonts: [{ cssSrc: 'https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500&display=swap' }]
});
const cardElement = elements.create('card', {
    style: {
        base: {
            fontFamily: "'Urbanist', sans-serif",
            fontSize: '16px',
            color: '#1A1A1A',
            '::placeholder': { color: '#999999' }
        }
    }
});
cardElement.mount('#card-element');
cardElement.on('change', function(event) {
    document.getElementById('card-errors').textContent = event.error ? event.error.message : '';
});

function changeQty(delta) {
    quantity = Math.max(1, Math.min(10, quantity + delta));
    document.getElementById('qtyValue').textContent = quantity;
    updatePrices();
}

function togglePromo() {
    document.getElementById('promoField').classList.toggle('show');
}

function applyPromo() {
    const code = document.getElementById('promoInput').value.trim().toUpperCase();
    const msg = document.getElementById('promoMsg');
    if (code === 'VEDOMIE10') {
        promoApplied = true;
        msg.textContent = 'Zľavový kód aplikovaný: -10%';
        msg.className = 'promo-msg success';
        updatePrices();
    } else {
        promoApplied = false;
        discount = 0;
        msg.textContent = 'Neplatný kód';
        msg.className = 'promo-msg error';
        updatePrices();
    }
}

function updatePrices() {
    const subtotal = BOOK_PRICE * quantity;
    discount = promoApplied ? subtotal * 0.10 : 0;
    const total = subtotal + SHIPPING - discount;

    document.getElementById('summaryQty').textContent = quantity;
    document.getElementById('summaryItemPrice').textContent = (BOOK_PRICE * quantity).toFixed(2) + ' €';
    document.getElementById('subtotal').textContent = subtotal.toFixed(2) + ' €';
    document.getElementById('totalPrice').textContent = total.toFixed(2) + ' €';
    document.getElementById('payBtnText').textContent = 'Zaplatiť ' + total.toFixed(2) + ' €';

    const discountLine = document.getElementById('discountLine');
    if (promoApplied) {
        discountLine.style.display = 'flex';
        document.getElementById('discountValue').textContent = '-' + discount.toFixed(2) + ' €';
    } else {
        discountLine.style.display = 'none';
    }
}

async function handlePayment() {
    const btn = document.getElementById('payBtn');
    const btnText = document.getElementById('payBtnText');

    const firstName = document.getElementById('firstName').value.trim();
    const lastName = document.getElementById('lastName').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const address = document.getElementById('address').value.trim();
    const city = document.getElementById('city').value.trim();
    const zip = document.getElementById('zip').value.trim();

    if (!firstName || !lastName || !email) {
        document.getElementById('card-errors').textContent = 'Vyplňte prosím meno, priezvisko a email.';
        return;
    }

    btn.disabled = true;
    btnText.textContent = 'Spracovávam...';

    try {
        const subtotal = BOOK_PRICE * quantity;
        const discountAmt = promoApplied ? subtotal * 0.10 : 0;
        const finalPrice = Math.round((subtotal + SHIPPING - discountAmt) * 100);

        const response = await fetch('/api/create-checkout-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email,
                name: firstName + ' ' + lastName,
                phone,
                address,
                city,
                zip,
                finalPrice,
                promoCode: promoApplied ? 'VEDOMIE10' : '',
                quantity
            })
        });

        const data = await response.json();

        if (data.sessionId) {
            await stripe.redirectToCheckout({ sessionId: data.sessionId });
        } else {
            throw new Error(data.error || 'Nepodarilo sa vytvoriť platbu');
        }
    } catch (err) {
        document.getElementById('card-errors').textContent = err.message;
        btn.disabled = false;
        const total = (BOOK_PRICE * quantity + SHIPPING - discount).toFixed(2);
        btnText.textContent = 'Zaplatiť ' + total + ' €';
    }
}

updatePrices();
</script>

</body>
</html>
